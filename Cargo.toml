[package]
name = "easypanel"
version = "0.1.0"
edition = "2021"
description = "CLI untuk mengelola banyak host EasyPanel"

[[bin]]
name = "easypanel"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
comfy-table = "7"
chrono = "0.4"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
