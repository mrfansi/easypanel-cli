[package]
name = "easypanel"
version = "0.98.11"
edition = "2021"
description = "Manage multiple EasyPanel hosts from your terminal — CLI + TUI"
license = "MIT"
repository = "https://github.com/mrfansi/easypanel-cli"
homepage = "https://github.com/mrfansi/easypanel-cli"
readme = "README.md"
keywords = ["easypanel", "tui", "devops", "cli", "self-hosted"]
categories = ["command-line-utilities"]
# Yang tak dipakai crate: spec API 0,7 MB (cuma rujukan pengembang, tak dibaca
# runtime), skrip installer (pemakai `cargo install` tak perlu), meta repo & CI.
exclude = [
    "easypanel-api.json",
    "install.sh",
    ".github/",
    ".editorconfig",
    ".gitattributes",
]

[[bin]]
name = "easypanel"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dialoguer = "0.11"
comfy-table = "7"
chrono = "0.4"
anyhow = "1"
ratatui = "0.30"
clap_complete = "4.6.7"
clap_mangen = "0.3.0"
# Terminal container: WebSocket ke /ws/containerShell. rustls agar cocok dengan
# reqwest (satu tumpukan TLS). libc untuk stdin non-blocking (passthrough byte
# mentah — crossterm mem-parse jadi KeyEvent, tak cocok untuk shell interaktif).
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
libc = "0.2"
vt100 = "0.15"
# AWS Signature v4 for presigned S3/R2 URLs (db dump → object storage). Pure-Rust,
# small, and shares the digest/generic-array already pulled in by the TLS stack.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
