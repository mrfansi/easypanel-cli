[package]
name = "easypanel"
version = "0.4.0"
edition = "2021"
description = "Manage multiple EasyPanel hosts from your terminal — CLI + TUI"
license = "MIT"
repository = "https://github.com/mrfansi/easypanel-cli"
homepage = "https://github.com/mrfansi/easypanel-cli"
readme = "README.md"
keywords = ["easypanel", "tui", "devops", "cli", "self-hosted"]
categories = ["command-line-utilities"]

[[bin]]
name = "easypanel"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
comfy-table = "7"
chrono = "0.4"
anyhow = "1"
ratatui = "0.29"
clap_complete = "4.6.7"
clap_mangen = "0.3.0"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
