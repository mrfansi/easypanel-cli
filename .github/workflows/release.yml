name: Release

on:
  push:
    tags: ["v*"]
  # Bisa dijalankan manual tanpa tag: pipeline rilis yang hanya terpicu oleh tag
  # baru ketahuan rusak saat kita justru sedang merilis. Run manual membangun dan
  # mengemas semuanya, tapi tidak menerbitkan apa pun.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        # Man page ikut di tarball supaya paket biner setara dengan `cargo install`.
        # Dibuat oleh biner yang baru dibangun; untuk target silang biner itu tak
        # bisa dijalankan, jadi man page dilewati alih-alih menggagalkan rilis.
        run: |
          cd target/${{ matrix.target }}/release
          # `> file` membuat filenya SEBELUM biner jalan, jadi kegagalan tetap
          # meninggalkan file kosong. -s (bukan -f) yang membedakan man page
          # sungguhan dari cangkang nol byte; tanpa ini rilis mengirim man page
          # kosong dan tak ada yang tahu sampai ada yang membukanya.
          ./easypanel man > easypanel.1 2>/dev/null || true
          if [ -s easypanel.1 ]; then
            tar -czf "$GITHUB_WORKSPACE/easypanel-${{ matrix.target }}.tar.gz" easypanel easypanel.1
          else
            echo "man page dilewati (biner tak bisa dijalankan di runner ini)"
            rm -f easypanel.1
            tar -czf "$GITHUB_WORKSPACE/easypanel-${{ matrix.target }}.tar.gz" easypanel
          fi
      # Selalu simpan hasilnya: run manual bisa diperiksa binernya, dan job
      # publish di bawah mengambil semuanya dari sini.
      - uses: actions/upload-artifact@v4
        with:
          name: easypanel-${{ matrix.target }}
          path: easypanel-${{ matrix.target }}.tar.gz

  # SATU job yang menerbitkan, setelah semua build selesai.
  #
  # Sebelumnya tiap job matrix memanggil action-gh-release sendiri, jadi ketiganya
  # berlomba MEMBUAT rilis yang sama. Di v0.5.1 balapan itu menghasilkan DUA objek
  # rilis pada detik yang sama: satu draft berisi biner Apple Silicon (tak terlihat
  # siapa pun) dan satu publik tanpa biner itu. Lima rilis sebelumnya hanya
  # beruntung. Menerbitkan dari satu job menghapus balapannya, bukan menambal
  # gejalanya dengan retry.
  publish:
    needs: build
    # Hanya menerbitkan saat memang dipicu tag; run manual berhenti setelah build.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Needed for the CHANGELOG; the artifacts alone carry no release notes.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        # Every release up to v0.98.9 published with an empty body: the workflow
        # only ever uploaded binaries, so the one place that says what changed
        # never reached the release page. Take the section for this tag, and fail
        # rather than publish an empty one — a silent blank release is how this
        # went unnoticed for 170 of them.
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG has no section for $v"; exit 1; }
          cat notes.md
      - name: Cek semua target ikut sebelum menerbitkan
        # Rilis yang kehilangan satu platform lebih buruk daripada rilis yang
        # gagal: ia terlihat berhasil sampai ada yang mengunduh dan tak menemukan
        # binernya.
        run: |
          ls -l dist
          for t in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            [ -s "dist/easypanel-$t.tar.gz" ] || { echo "::error::$t hilang"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*.tar.gz
