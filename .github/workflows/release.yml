name: Release

on:
  push:
    tags: ["v*"]
  # Bisa dijalankan manual tanpa tag: pipeline rilis yang hanya terpicu oleh tag
  # baru ketahuan rusak saat kita justru sedang merilis. Run manual membangun dan
  # mengemas semuanya, tapi tidak menerbitkan apa pun.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf easypanel-${{ matrix.target }}.tar.gz easypanel
      # Selalu simpan hasilnya, supaya run manual tetap bisa diperiksa binernya.
      - uses: actions/upload-artifact@v4
        with:
          name: easypanel-${{ matrix.target }}
          path: easypanel-${{ matrix.target }}.tar.gz
      - name: Upload to release
        # Hanya menerbitkan saat memang dipicu tag. Tanpa guard ini, run manual
        # akan membuat rilis dari nama branch.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: easypanel-${{ matrix.target }}.tar.gz
