name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisory baru muncul tanpa peduli kita commit atau tidak. Tanpa jadwal, kita
  # hanya tahu ada kerentanan saat kebetulan sedang mengubah sesuatu.
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libegl1-mesa-dev libgl1-mesa-dev
      # Explicit --bin keeps Unix-only CLI/TUI code out of the Windows build.
      - name: Build desktop
        run: cargo build --locked --release --features desktop --bin easypanel-desktop --target ${{ matrix.target }}
      - name: Package Linux executable or macOS app
        if: runner.os != 'Windows'
        run: bash scripts/package-desktop.sh ${{ matrix.target }}
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-desktop.ps1
      - name: Clippy desktop
        if: runner.os == 'Linux'
        run: cargo clippy --locked --features desktop --bin easypanel-desktop -- -D warnings
      - name: Test desktop
        if: runner.os == 'Linux'
        run: cargo test --locked --features desktop --bin easypanel-desktop

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Sengaja TANPA --deny warnings: `cargo audit` polos gagal pada kerentanan
      # sungguhan dan hanya mencatat peringatan "unmaintained". CI yang merah
      # terus-menerus berhenti dibaca, lalu kerentanan sungguhan lewat.
      #
      # Hari ini: 0 kerentanan, 1 peringatan — async-std, lewat httpmock, sebuah
      # DEV-dependency yang tak pernah ikut ke biner yang dirilis. (lru unsound
      # dan paste hilang saat ratatui naik ke 0.30.)
      - run: cargo audit
