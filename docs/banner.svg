  <g fill="#30363d">
    <rect x="560" y="52" width="264" height="14" rx="3"/>
    <rect x="560" y="78" width="230" height="10" rx="3"/>
    <rect x="560" y="98" width="248" height="10" rx="3"/>
    <rect x="560" y="118" width="210" height="10" rx="3"/>
    <rect x="560" y="138" width="240" height="10" rx="3"/>
  </g>
  <g fill="#23d18b">
    <circle cx="551" cy="83" r="4"/>
    <circle cx="551" cy="103" r="4"/>
    <circle cx="551" cy="123" r="4"/>
    <circle cx="551" cy="143" r="4"/>
  </g>
</svg>
